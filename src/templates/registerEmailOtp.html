<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{title}}</title>
</head>
<body style="margin:0;padding:0;background-color:#f4f4f5;font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background-color:#f4f4f5;padding:32px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:520px;background-color:#ffffff;border-radius:10px;overflow:hidden;box-shadow:0 4px 24px rgba(0,0,0,0.08);">
          <tr>
            <td style="background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);padding:28px 32px;text-align:center;">
              <p style="margin:0;font-size:22px;font-weight:700;color:#ffffff;letter-spacing:1px;">FLUXO</p>
              <p style="margin:8px 0 0;font-size:14px;color:rgba(255,255,255,0.9);">{{subtitle}}</p>
            </td>
          </tr>
          <tr>
            <td style="padding:32px;text-align:center;">
              <p style="margin:0 0 20px;font-size:15px;line-height:1.6;color:#555555;">{{message}}</p>
              <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background-color:#f5f5f5;border:2px solid #667eea;border-radius:8px;">
                <tr>
                  <td style="padding:24px 16px;text-align:center;">
                    <p style="margin:0 0 8px;font-size:12px;font-weight:600;color:#666666;text-transform:uppercase;letter-spacing:1px;">Your code</p>
                    <p style="margin:0;font-size:36px;font-weight:700;color:#667eea;letter-spacing:8px;font-family:'Courier New',Courier,monospace;">{{otp}}</p>
                    <p style="margin:12px 0 0;font-size:14px;font-weight:600;color:#e74c3c;">Expires in 5 minutes</p>
                  </td>
                </tr>
              </table>
              <p style="margin:24px 0 0;font-size:13px;color:#999999;">If you didn't request this code, you can safely ignore this email.</p>
            </td>
          </tr>
          <tr>
            <td style="padding:20px 32px;border-top:1px solid #eeeeee;text-align:center;">
              <p style="margin:0;font-size:12px;line-height:1.8;color:#999999;">&copy; 2026 Fluxo. All rights reserved.</p>
              <p style="margin:4px 0 0;font-size:12px;color:#999999;">This is an automated message. Please do not reply.</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
