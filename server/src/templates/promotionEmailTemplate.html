<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{title}</title>
  </head>
  <body style="margin:0;padding:0;width:100%;font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;color:#000;background-color:#ffffff;">
    <table role="presentation" width="100%" border="0" cellspacing="0" cellpadding="0" style="margin:0;padding:0;">
      <tr>
        <td align="center" style="padding:24px 20px;">
          <p style="margin:0;font-size:22px;font-weight:700;letter-spacing:1px;">FLUXO</p>
        </td>
      </tr>
      <tr>
        <td style="border-top:1px solid #eeeeee;padding:16px 20px;">
          <table role="presentation" width="100%" border="0" cellspacing="0" cellpadding="0" style="max-width:600px;margin:0 auto;">
            <tr>
              <td align="center">
                <table role="presentation" width="100%" border="0" cellspacing="0" cellpadding="0">
                  <tr>
                    <td align="center" style="font-size:14px;font-weight:500;padding:0 10px;">
                      <a href="{link1}" style="text-decoration:none;color:#000;">{link1Text}</a>
                    </td>
                    <td align="center" style="font-size:14px;font-weight:500;padding:0 10px;">
                      <a href="{link2}" style="text-decoration:none;color:#000;">{link2Text}</a>
                    </td>
                    <td align="center" style="font-size:14px;font-weight:500;padding:0 10px;">
                      <a href="{link3}" style="text-decoration:none;color:#000;">{link3Text}</a>
                    </td>
                    <td align="center" style="font-size:14px;font-weight:500;padding:0 10px;">
                      <a href="{link4}" style="text-decoration:none;color:#000;">{link4Text}</a>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
          </table>
        </td>
      </tr>
      <tr>
        <td>
          <a href="{bannerLink}" style="display:block;width:100%;overflow:hidden;background-color:#eeeeee;">
            <img src="{imageUrl}" alt="{title}" style="max-width:100%;height:auto;display:block;margin:0 auto;" />
          </a>
        </td>
      </tr>
      <tr>
        <td style="padding:8px 20px 0;text-align:center;">
          <p style="margin:0 0 8px;font-size:14px;line-height:1.6;color:#555555;">{description}</p>
          <h1 style="text-align:center;padding:12px 20px 20px;font-size:20px;margin:0;">{title}</h1>
          <p style="margin:0 0 24px;font-size:14px;font-weight:600;color:#667eea;">{discountLabel}</p>
        </td>
      </tr>
      <tr>
        <td align="center" style="padding:0 16px 32px;">
          {productsHtml}
        </td>
      </tr>
      <tr>
        <td align="center" style="padding:20px;border-top:1px solid #eeeeee;">
          <a href="{bannerLink}" style="display:inline-block;background:#667eea;color:#ffffff;text-decoration:none;padding:12px 28px;border-radius:5px;font-size:15px;font-weight:600;">Shop the sale</a>
          <p style="margin:16px 0 0;font-size:12px;color:#999999;">You received this email because you subscribed to Fluxo promotions.</p>
        </td>
      </tr>
    </table>
  </body>
</html>
